name: Tablero diario

# Genera el tablero en la nube y commitea el resultado; Vercel auto-deploya.
on:
  schedule:
    # 12:30 UTC ≈ 08:30 en Chile (invierno UTC-4). Ajustar si cambia el horario.
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write         # para commitear el output de vuelta al repo

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar tablero
        run: python trends_board/board.py --no-open

      - name: Commitear resultado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public trends_board/output
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Tablero: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
